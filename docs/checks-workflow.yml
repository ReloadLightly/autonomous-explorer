name: Foundations checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen explorer verify --results results/milestone
